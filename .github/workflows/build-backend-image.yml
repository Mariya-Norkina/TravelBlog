
name: Build backend Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/AngularBlog.Backend/**'
      - '.github/workflows/build-backend-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend/AngularBlog.Backend
          file: backend/AngularBlog.Backend/Dockerfile
          tags: travelblog-api:latest
          load: true

      - name: Save Docker image
        run: docker save travelblog-api:latest | gzip > travelblog-api.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: travelblog-api-image
          path: travelblog-api.tar.gz
          retention-days: 7
