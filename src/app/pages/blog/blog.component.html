<div class="blog-wrapper">
  <div class="blog-header-slot">
    @if (postsLoaded) {
      <h2 tuiAnimated class="blog-main-title anim-slide-top-1s">Блог</h2>

      <div class="search-bar-row">
        <div class="controls-wrapper">
          <div tuiAnimated class="date-container anim-slide-right-08s-d10">
            <span class="date-emoji">📅</span>
            <input type="date" [(ngModel)]="selectedDate" (change)="onDateChange()">
          </div>

          @if (selectedDate) {
            <button tuiAnimated class="clear-date-btn anim-slide-right-08s-d12" (click)="clearDate()">✕</button>
          }

          <div tuiAnimated class="search-container anim-slide-right-08s-d14">
            <input
              type="text"
              [(ngModel)]="searchQuery"
              (input)="onSearchInputChange()"
              (keyup.enter)="onSearch()"
              placeholder="Поиск по заголовку или автору..."
            >
            <button class="search-btn" (click)="onSearch()">🔍</button>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="posts-container" *ngIf="filteredPosts.length > 0">
      <app-post-card 
        *ngFor="let post of paginatedPosts"
        [post]="post"
        [isLiked]="hasUserLiked(post)"
        [isLoggedIn]="authService.isLoggedIn()"
        [currentUsername]="authService.currentUser?.username"
        [currentUserId]="authService.currentUser?.id ?? null"
        [showAdminActions]="false"
        style="cursor: pointer;"
        (click)="openPost(post)"
        (like)="toggleLike($event)">
      </app-post-card>

  <div class="no-posts-message" *ngIf="filteredPosts.length === 0">
    <p>Посты не найдены. Попробуйте изменить запрос.</p>
  </div>
</div>

  <div class="pagination-panel" *ngIf="totalPages > 1">
    <button class="page-arrow" [disabled]="currentPage === 1" (click)="goToPrevPage()">🡨</button>
    <span class="page-info">Страница <strong>{{ currentPage }}</strong> из <strong>{{ totalPages }}</strong></span>
    <button class="page-arrow" [disabled]="currentPage === totalPages" (click)="goToNextPage()">🡪</button>
  </div>
