<div class="post-card" [class.in-profile]="isInProfile">
  <div class="post-image" [class.no-image]="!post.photoBase64">
    <img *ngIf="post.photoBase64" [src]="post.photoBase64" alt="{{ post.title }}">
  </div>

  <div class="post-card-content">
    <h3>{{ post.title }}</h3>
    <p class="post-date">{{ post.date }}</p>
    <p class="post-author">Автор: {{ post.author }}</p>
    <p class="post-description">{{ post.description | truncateWords:5 }}</p>
  </div>

  <div class="post-photo-placeholder">
    <button type="button" (click)="detail.emit(post)" class="detail-btn">Подробнее</button>
    
    <ng-container class="post-admin-actions" *ngIf="showAdminActions && currentUsername && post.author === currentUsername">
      <button type="button" class="action-btn edit-btn" title="Редактировать пост" (click)="edit.emit(post)">✎</button>
      <button type="button" class="action-btn delete-btn" title="Удалить пост" (click)="delete.emit(post.id)">🗑</button>
    </ng-container>

  <div class="like-container">
    <button class="like-button" [class.liked]="isLiked" (click)="onLikeClick($event)">✸</button>
    <span class="like-count">
    {{ post.likes ? post.likes.length : (post.likesCount || 0) }}
    </span>
  </div>
  </div>
</div>
